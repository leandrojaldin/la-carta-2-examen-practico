<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Carta - Acceso</title>
</head>
<body>
    <h1>Error {{ status }}</h1>
    <p>{{ mensaje }}</p>

    {% if status == 401 %}
        <a href="{{ url_for('auth0.login_auth0') }}">
            Iniciar sesión con Auth0
        </a>
    {% endif %}

    <p>
        <a href="{{ url_for('inicio') }}">
            Volver a la carta
        </a>
    </p>
</body>
</html>
